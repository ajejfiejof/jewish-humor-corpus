[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jewish-humor-corpus"
version = "0.4.0"
description = "A comprehensive computational linguistics, folklore research, and ML dataset suite for Jewish humor with FTS5, semantic vector search, primary joke registries, and instruction tuning exports."
readme = "README.md"
license = { text = "MIT", url = "LICENSE" }
authors = [
    { name = "ajejfiejof" }
]
dependencies = [
    "rich>=13.0.0",
    "pandas>=1.3.0",
]

[project.scripts]
jhc = "cli:main"
jewish-humor-corpus = "cli:main"

[project.urls]
Homepage = "https://github.com/ajejfiejof/jewish-humor-corpus"
Repository = "https://github.com/ajejfiejof/jewish-humor-corpus.git"
License-AGPL = "LICENSE_AGPL3"
License-CC-BY-SA = "LICENSE_CC_BY_SA4"

[tool.setuptools]
py-modules = ["cli", "demo"]
